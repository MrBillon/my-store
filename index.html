<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Store</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f6;
}

header {
  background: #131921;
  color: white;
  padding: 15px;
  font-size: 20px;
  text-align: center;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 8px;
  padding: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  border-radius: 6px;
}

.card h3 {
  font-size: 16px;
}

.price {
  color: green;
  font-weight: bold;
}

button {
  background: #ff9f00;
  border: none;
  padding: 8px;
  width: 100%;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 5px;
}

.cart {
  position: fixed;
  bottom: 0;
  background: white;
  width: 100%;
  padding: 10px;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<header>🛍 My Online Store</header>

<div class="products" id="products"></div>

<div class="cart">
  🛒 Cart Items: <span id="count">0</span> |
  Total: ₹<span id="total">0</span>
  <button onclick="checkout()">Checkout</button>
</div>

<script>
const products = [
  { id: 1, name: "Wireless Earbuds", price: 1299, img: "https://via.placeholder.com/200" },
  { id: 2, name: "Smart Watch", price: 1999, img: "https://via.placeholder.com/200" },
  { id: 3, name: "Bluetooth Speaker", price: 1499, img: "https://via.placeholder.com/200" },
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";
  products.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p class="price">₹${p.price}</p>
        <button onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    `;
  });
}

function addToCart(id) {
  const product = products.find(p => p.id === id);
  cart.push(product);
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
}

function updateCart() {
  document.getElementById("count").innerText = cart.length;
  document.getElementById("total").innerText =
    cart.reduce((sum, item) => sum + item.price, 0);
}

function checkout() {
  alert("Order placed! (Demo)");
}

renderProducts();
updateCart();
</script>

</body>
</html>
